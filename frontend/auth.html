<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar ou Criar conta — TripCraft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/theme-init.js"></script>
  </head>
  <body>
    <nav class="navbar tc-navbar">
      <div class="container py-1 d-flex justify-content-between align-items-center">
        <a class="tc-brand" href="/index.html">
          <span class="tc-brand-icon"><i class="bi bi-compass-fill"></i></span>
          <span>TripCraft</span>
        </a>
        <div class="d-flex align-items-center gap-2">
          <button
            type="button"
            class="btn tc-theme-toggle"
            aria-label="Alternar modo escuro"
            title="Alternar modo escuro"
          >
            <i class="bi bi-moon-stars-fill"></i>
          </button>
          <a href="/index.html" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Voltar ao início
          </a>
        </div>
      </div>
    </nav>

    <main class="tc-auth-wrapper">
      <div class="tc-card tc-auth-card p-4 p-sm-5">
        <div class="text-center mb-4">
          <h1 class="h4 fw-bold mb-1" id="auth-heading">Acesse sua conta</h1>
          <p class="text-secondary small mb-0" id="auth-subheading">
            Gerencie suas viagens, roteiros e despesas em um só lugar.
          </p>
        </div>

        <ul class="nav nav-pills nav-fill tc-auth-tabs bg-light p-1 rounded-3 mb-4" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="tab-login-btn"
              data-bs-toggle="pill"
              data-bs-target="#pane-login"
              type="button"
              role="tab"
              aria-controls="pane-login"
              aria-selected="true"
            >
              Entrar
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="tab-cadastro-btn"
              data-bs-toggle="pill"
              data-bs-target="#pane-cadastro"
              type="button"
              role="tab"
              aria-controls="pane-cadastro"
              aria-selected="false"
            >
              Criar conta
            </button>
          </li>
        </ul>

        <div id="auth-alert" class="d-none"></div>

        <div class="tab-content">
          <!-- Login -->
          <div
            class="tab-pane fade show active"
            id="pane-login"
            role="tabpanel"
            aria-labelledby="tab-login-btn"
          >
            <form id="form-login" novalidate>
              <div class="mb-3">
                <label for="login-email" class="form-label fw-semibold small">E-mail</label>
                <input
                  type="email"
                  class="form-control"
                  id="login-email"
                  name="email"
                  placeholder="seuemail@exemplo.com"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="mb-4">
                <label for="login-senha" class="form-label fw-semibold small">Senha</label>
                <div class="input-group">
                  <input
                    type="password"
                    class="form-control"
                    id="login-senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                  />
                  <button
                    class="btn btn-outline-secondary toggle-password"
                    type="button"
                    data-target="login-senha"
                    aria-label="Mostrar ou ocultar senha"
                  >
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <button type="submit" id="btn-login" class="btn btn-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
              </button>
            </form>
          </div>

          <!-- Cadastro -->
          <div
            class="tab-pane fade"
            id="pane-cadastro"
            role="tabpanel"
            aria-labelledby="tab-cadastro-btn"
          >
            <form id="form-cadastro" novalidate>
              <div class="mb-3">
                <label for="cadastro-nome" class="form-label fw-semibold small">Nome completo</label>
                <input
                  type="text"
                  class="form-control"
                  id="cadastro-nome"
                  name="nome"
                  maxlength="120"
                  placeholder="Ex.: Ana Silva"
                  autocomplete="name"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="cadastro-email" class="form-label fw-semibold small">E-mail</label>
                <input
                  type="email"
                  class="form-control"
                  id="cadastro-email"
                  name="email"
                  maxlength="254"
                  placeholder="ana@exemplo.com"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="cadastro-senha" class="form-label fw-semibold small">Senha</label>
                <div class="input-group">
                  <input
                    type="password"
                    class="form-control"
                    id="cadastro-senha"
                    name="senha"
                    minlength="6"
                    placeholder="Mínimo de 6 caracteres"
                    autocomplete="new-password"
                    required
                  />
                  <button
                    class="btn btn-outline-secondary toggle-password"
                    type="button"
                    data-target="cadastro-senha"
                    aria-label="Mostrar ou ocultar senha"
                  >
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <div class="mb-4">
                <label for="cadastro-confirmar-senha" class="form-label fw-semibold small">
                  Confirmar senha
                </label>
                <div class="input-group">
                  <input
                    type="password"
                    class="form-control"
                    id="cadastro-confirmar-senha"
                    name="confirmarSenha"
                    minlength="6"
                    placeholder="Repita a senha"
                    autocomplete="new-password"
                    required
                  />
                  <button
                    class="btn btn-outline-secondary toggle-password"
                    type="button"
                    data-target="cadastro-confirmar-senha"
                    aria-label="Mostrar ou ocultar confirmação de senha"
                  >
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <button type="submit" id="btn-cadastro" class="btn btn-primary w-100 py-2">
                <i class="bi bi-person-plus me-1"></i>Criar conta
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="tc-footer py-3">
      <div class="container text-center">
        <span><strong>TripCraft</strong> &bull; Seus planejamentos de viagem protegidos por conta</span>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
